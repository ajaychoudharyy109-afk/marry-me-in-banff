# Netlify build settings for Marry Me, In Banff

[build]
  command   = "node build.js"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Never cache the editor's config, so a change to it shows up straight away.
[[headers]]
  for = "/admin/config.yml"
  [headers.values]
    Cache-Control = "no-cache"

# The editor is for Lorelle only — keep it out of Google.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
